<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetRoom — ставки с друзьями</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f13; color: #e8e8e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 420px; padding: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    h1 span { color: #7c6ff7; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    .tabs { display: flex; gap: 4px; background: #1a1a22; border-radius: 10px; padding: 4px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 8px; border: none; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 500; background: transparent; color: #888; transition: all .15s; }
    .tab.active { background: #7c6ff7; color: #fff; }
    .card { background: #1a1a22; border-radius: 14px; padding: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
    input, select { width: 100%; padding: 10px 14px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 8px; color: #e8e8e8; font-size: 15px; outline: none; transition: border-color .15s; }
    input:focus, select:focus { border-color: #7c6ff7; }
    select option { background: #1a1a22; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    .btn { width: 100%; padding: 12px; background: #7c6ff7; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; margin-top: 4px; }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .4; cursor: default; }
    .error { background: #2a1a1a; border: 1px solid #7c2a2a; color: #f07070; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 12px; display: none; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bet<span>Room</span></h1>
    <p class="subtitle">Ставки между друзьями — без казино</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('create')">Создать комнату</button>
      <button class="tab" onclick="switchTab('join')">Войти по коду</button>
    </div>

    <!-- CREATE -->
    <div class="panel active" id="panel-create">
      <div class="card">
        <div class="field">
          <label>Название комнаты</label>
          <input id="c-title" type="text" placeholder="Финал ЛЧ у Кирилла" maxlength="60">
        </div>
        <div class="field">
          <label>Твой никнейм</label>
          <input id="c-nick" type="text" placeholder="Хост" maxlength="30">
        </div>
        <div class="row">
          <div class="field">
            <label>Режим</label>
            <select id="c-mode">
              <option value="pvp">PvP</option>
              <option value="bankroll">Пока не сорвёшь банк</option>
            </select>
          </div>
          <div class="field">
            <label>Стартовый баланс</label>
            <input id="c-balance" type="number" value="1000" min="100" max="100000">
          </div>
        </div>
        <button class="btn" id="btn-create" onclick="createSession()">Создать комнату</button>
        <div class="error" id="err-create"></div>
      </div>
    </div>

    <!-- JOIN -->
    <div class="panel" id="panel-join">
      <div class="card">
        <div class="field">
          <label>Код комнаты</label>
          <input id="j-code" type="text" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:.1em;font-size:20px;text-align:center">
        </div>
        <div class="field">
          <label>Твой никнейм</label>
          <input id="j-nick" type="text" placeholder="Игрок" maxlength="30">
        </div>
        <button class="btn" id="btn-join" onclick="joinSession()">Войти в комнату</button>
        <div class="error" id="err-join"></div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='create')));
      document.getElementById('panel-create').classList.toggle('active', tab === 'create');
      document.getElementById('panel-join').classList.toggle('active', tab === 'join');
    }

    async function createSession() {
      const btn = document.getElementById('btn-create');
      const err = document.getElementById('err-create');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Создаём...';

      try {
        const res = await fetch('/api/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: document.getElementById('c-title').value.trim(),
            nickname: document.getElementById('c-nick').value.trim(),
            mode: document.getElementById('c-mode').value,
            startingBalance: parseInt(document.getElementById('c-balance').value)
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        localStorage.setItem('guestToken', data.guestToken);
        localStorage.setItem('playerId', data.player.id);
        localStorage.setItem('sessionId', data.session.id);
        window.location.href = `/room.html?id=${data.session.id}`;
      } catch (e) {
        err.textContent = e.message; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Создать комнату';
      }
    }

    async function joinSession() {
      const btn = document.getElementById('btn-join');
      const err = document.getElementById('err-join');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Входим...';

      const code = document.getElementById('j-code').value.trim().toUpperCase();
      const nickname = document.getElementById('j-nick').value.trim();

      try {
        const sessionRes = await fetch(`/api/sessions/${code}`);
        const session = await sessionRes.json();
        if (!sessionRes.ok) throw new Error(session.error);

        const joinRes = await fetch(`/api/sessions/${session.id}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname })
        });
        const data = await joinRes.json();
        if (!joinRes.ok) throw new Error(data.error);

        localStorage.setItem('guestToken', data.guestToken);
        localStorage.setItem('playerId', data.player.id);
        localStorage.setItem('sessionId', session.id);
        window.location.href = `/room.html?id=${session.id}`;
      } catch (e) {
        err.textContent = e.message; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Войти в комнату';
      }
    }
  </script>
</body>
</html>
