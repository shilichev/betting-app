<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetRoom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f13; color: #e8e8e8; min-height: 100vh; }
    .topbar { background: #1a1a22; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a35; }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar h1 span { color: #7c6ff7; }
    .room-code { background: #2a2a35; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; letter-spacing: .08em; cursor: pointer; }
    .room-code:hover { background: #3a3a48; }
    .layout { display: flex; max-width: 1100px; margin: 0 auto; padding: 24px; gap: 20px; }
    .sidebar { width: 230px; flex-shrink: 0; }
    .main { flex: 1; min-width: 0; }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #666; margin-bottom: 10px; }
    .player-item { background: #1a1a22; border-radius: 8px; margin-bottom: 6px; }
    .player-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 14px; }
    .player-name { display: flex; align-items: center; gap: 5px; }
    .badge { font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
    .badge-host { background: #7c6ff7; color: #fff; }
    .badge-you  { background: #1a4a3a; color: #5dcaa5; }
    .balance { font-weight: 700; color: #7c6ff7; }
    .balance-controls { display: flex; gap: 4px; padding: 0 8px 8px; }
    .bal-input { flex: 1; padding: 4px 8px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 6px; color: #e8e8e8; font-size: 12px; }
    .btn { padding: 6px 12px; border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-primary { background: #7c6ff7; color: #fff; }
    .btn-success { background: #1a4a3a; color: #5dcaa5; }
    .btn-danger  { background: #4a1a1a; color: #f07070; }
    .btn-amber   { background: #4a3010; color: #ef9f27; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .tabs { display: flex; gap: 4px; background: #1a1a22; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 8px; border: none; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; background: transparent; color: #888; transition: all .15s; }
    .tab.active { background: #7c6ff7; color: #fff; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: #1a1a22; border-radius: 12px; padding: 18px; margin-bottom: 14px; border: 1px solid #2a2a35; }
    .card-dashed { background: #1a1a22; border: 2px dashed #2a2a35; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .event-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .options { display: flex; gap: 10px; margin-bottom: 12px; }
    .option { flex: 1; background: #0f0f13; border-radius: 8px; padding: 10px; text-align: center; }
    .option-label { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    .option-odds { font-size: 20px; font-weight: 700; color: #7c6ff7; }
    .bet-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .bet-select { flex: 1; min-width: 100px; padding: 7px 10px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 7px; color: #e8e8e8; font-size: 13px; }
    .inp { padding: 7px 10px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 7px; color: #e8e8e8; font-size: 13px; }
    .inp:focus { outline: none; border-color: #7c6ff7; }
    .inp-w { width: 100px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 10px; color: #666; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing:.04em; }
    .field input, .field select { width: 100%; padding: 7px 10px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 7px; color: #e8e8e8; font-size: 13px; outline: none; }
    .field input:focus { border-color: #7c6ff7; }
    .row-2 { display: flex; gap: 10px; }
    .row-2 .field { flex: 1; }
    .status-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
    .s-open     { background: #1a3a2a; color: #5dcaa5; }
    .s-locked   { background: #3a2a1a; color: #ef9f27; }
    .s-resolved { background: #2a2a3a; color: #7c6ff7; }
    .s-created  { background: #2a2a35; color: #888; }
    .s-confirmed{ background: #1a3a2a; color: #5dcaa5; }
    .s-won      { background: #1a3a2a; color: #5dcaa5; }
    .s-lost     { background: #3a1a1a; color: #f07070; }
    .bets-list { margin-top: 10px; border-top: 1px solid #2a2a35; padding-top: 8px; }
    .bet-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; color: #888; gap: 8px; }
    .bet-row.won  { color: #5dcaa5; }
    .bet-row.lost { color: #f07070; opacity: .6; text-decoration: line-through; }
    .host-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .share-bar { background: #1a1a3a; border: 1px solid #3a3a6a; border-radius: 10px; padding: 10px 16px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
    .session-btns { display: flex; gap: 8px; margin-bottom: 18px; }
    .score-bet-card { background: #1a1a22; border-radius: 12px; padding: 16px; margin-bottom: 10px; border: 1px solid #2a2a35; }
    .score-bet-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .score-bet-title { font-size: 14px; font-weight: 600; }
    .score-bet-pred { font-size: 22px; font-weight: 700; color: #7c6ff7; margin-bottom: 4px; }
    .score-bet-meta { font-size: 12px; color: #666; }
    .empty { text-align: center; padding: 40px; color: #555; font-size: 14px; }
    .status-bar { font-size: 12px; color: #666; padding: 5px 10px; background: #1a1a22; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #5dcaa5; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .payout-label { color: #5dcaa5; font-weight: 700; }
    @media(max-width:640px){ .layout{flex-direction:column;padding:14px} .sidebar{width:100%} }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Bet<span>Room</span></h1>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="status-bar"><div class="dot"></div><span id="session-status">...</span></div>
    <div class="room-code" id="room-code" onclick="copyCode()">—</div>
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="section-title">Игроки</div>
    <div id="players-list"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="share-bar" id="share-bar" style="display:none">
      Код комнаты: <strong id="share-code" style="letter-spacing:.08em;font-size:16px">—</strong>
      <button class="btn btn-primary btn-sm" onclick="copyCode()">Скопировать</button>
    </div>

    <div id="host-session-btns" style="display:none" class="session-btns">
      <button class="btn btn-success btn-sm" id="btn-start" onclick="startSession()">▶ Начать игру</button>
      <button class="btn btn-danger btn-sm" id="btn-finish" onclick="finishSession()">■ Завершить</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('events')">Ставки PvP</button>
      <button class="tab" onclick="switchTab('score')">Точный счёт</button>
    </div>

    <!-- PvP EVENTS -->
    <div class="panel active" id="panel-events">
      <div id="add-event-form" style="display:none">
        <div class="card-dashed">
          <div style="font-size:13px;font-weight:600;color:#888;margin-bottom:12px">+ Новое событие</div>
          <div class="field"><label>Название</label><input id="ev-title" placeholder="Кто забьёт первый?"></div>
          <div class="row-2">
            <div class="field"><label>Вариант A</label><input id="ev-a" placeholder="Мбаппе"></div>
            <div class="field"><label>Коэф. A</label><input id="ev-oa" type="number" value="2.0" step="0.1" min="1.1"></div>
          </div>
          <div class="row-2">
            <div class="field"><label>Вариант B</label><input id="ev-b" placeholder="Холланд"></div>
            <div class="field"><label>Коэф. B</label><input id="ev-ob" type="number" value="2.0" step="0.1" min="1.1"></div>
          </div>
          <button class="btn btn-primary" onclick="createEvent()">Создать</button>
        </div>
      </div>
      <div id="events-list"></div>
    </div>

    <!-- EXACT SCORE -->
    <div class="panel" id="panel-score">
      <!-- Player form -->
      <div id="score-bet-form" style="display:none">
        <div class="card-dashed">
          <div style="font-size:13px;font-weight:600;color:#888;margin-bottom:12px">Моя ставка на точный счёт</div>
          <div class="field"><label>Событие / матч</label><input id="sb-title" placeholder="Финал ЛЧ 2026"></div>
          <div class="row-2">
            <div class="field"><label>Счёт (например 2:1)</label><input id="sb-pred" placeholder="2:1" style="font-size:18px;font-weight:700;text-align:center;letter-spacing:.1em"></div>
            <div class="field"><label>Сумма</label><input id="sb-amount" type="number" placeholder="100" min="1"></div>
          </div>
          <button class="btn btn-primary" onclick="placeScoreBet()">Поставить</button>
        </div>
      </div>
      <div id="score-bets-list"></div>
    </div>
  </div>
</div>

<script>
  const sessionId = new URLSearchParams(location.search).get('id');
  const guestToken = localStorage.getItem('guestToken');
  const myPlayerId = localStorage.getItem('playerId');
  let state = null;
  let scoreBets = [];
  let isHost = false;
  let activeTab = 'events';

  if (!sessionId || !guestToken) location.href = '/';

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'events')));
    document.getElementById('panel-events').classList.toggle('active', tab === 'events');
    document.getElementById('panel-score').classList.toggle('active', tab === 'score');
  }

  async function load() {
    try {
      const [fullRes, scoreRes] = await Promise.all([
        fetch(`/api/sessions/${sessionId}/full`),
        fetch(`/api/score-bets/${sessionId}`)
      ]);
      state = await fullRes.json();
      scoreBets = await scoreRes.json();
      render();
    } catch(e) { console.error(e); }
  }

  function render() {
    const { session, players, events } = state;
    const me = players.find(p => p.id === myPlayerId);
    isHost = me?.is_host;

    document.getElementById('room-code').textContent = session.code;
    document.getElementById('share-code').textContent = session.code;
    document.getElementById('session-status').textContent =
      session.status === 'waiting' ? 'Ожидание' :
      session.status === 'active'  ? 'Идёт игра' : 'Завершена';

    document.getElementById('share-bar').style.display = session.status === 'waiting' ? 'flex' : 'none';
    document.getElementById('host-session-btns').style.display = isHost ? 'flex' : 'none';
    document.getElementById('btn-start').style.display = session.status === 'waiting' ? '' : 'none';
    document.getElementById('btn-finish').style.display = session.status === 'active' ? '' : 'none';
    document.getElementById('add-event-form').style.display = isHost && session.status === 'active' ? 'block' : 'none';
    document.getElementById('score-bet-form').style.display = session.status === 'active' ? 'block' : 'none';

    // Players sidebar
    const pl = document.getElementById('players-list');
    pl.innerHTML = players.sort((a,b) => b.balance - a.balance).map(p => `
      <div class="player-item">
        <div class="player-row">
          <div class="player-name">
            ${p.is_host ? '<span class="badge badge-host">HOST</span>' : ''}
            ${p.id === myPlayerId ? '<span class="badge badge-you">ТЫ</span>' : ''}
            <span>${p.nickname}</span>
          </div>
          <span class="balance">${p.balance.toLocaleString()}</span>
        </div>
        ${isHost && session.status === 'active' ? `
          <div class="balance-controls">
            <input class="bal-input" type="number" id="bal-${p.id}" placeholder="±сумма">
            <button class="btn btn-success btn-sm" onclick="adjustBalance('${p.id}', 1)">+</button>
            <button class="btn btn-danger btn-sm" onclick="adjustBalance('${p.id}', -1)">−</button>
          </div>
        ` : ''}
      </div>
    `).join('');

    renderEvents(events, me, session);
    renderScoreBets(me, session);
  }

  function renderEvents(events, me, session) {
    const el = document.getElementById('events-list');
    if (!events.length) {
      el.innerHTML = `<div class="empty">${isHost && session.status === 'active' ? 'Создай первое событие ↑' : 'Событий пока нет'}</div>`;
      return;
    }
    el.innerHTML = events.map(ev => {
      const myBet = ev.bets.find(b => b.player_id === myPlayerId);
      const canBet = !myBet && ev.status === 'open' && session.status === 'active';
      const totalPool = ev.bets.reduce((s,b) => s + b.amount, 0);
      return `
      <div class="card">
        <div class="event-title">
          ${ev.title}
          <span class="status-badge s-${ev.status}">${ev.status === 'open' ? 'Открыто' : ev.status === 'locked' ? 'Закрыто' : 'Завершено'}</span>
          ${isHost && ev.status === 'open' ? `<button class="btn btn-amber btn-sm" onclick="lockEvent('${ev.id}')">Закрыть ставки</button>` : ''}
        </div>
        ${ev.outcome ? `<div style="font-size:12px;color:#888;margin-bottom:8px">Победитель: <span style="color:#5dcaa5;font-weight:700">${ev.outcome}</span></div>` : ''}
        <div class="options">
          <div class="option" style="${ev.outcome===ev.option_a?'border:1px solid #5dcaa5':''}">
            <div class="option-label">${ev.option_a}</div>
            <div class="option-odds">×${ev.odds_a}</div>
          </div>
          <div class="option" style="${ev.outcome===ev.option_b?'border:1px solid #5dcaa5':''}">
            <div class="option-label">${ev.option_b}</div>
            <div class="option-odds">×${ev.odds_b}</div>
          </div>
        </div>
        ${canBet ? `
          <div class="bet-form">
            <select class="bet-select" id="side-${ev.id}">
              <option value="${ev.option_a}">${ev.option_a} ×${ev.odds_a}</option>
              <option value="${ev.option_b}">${ev.option_b} ×${ev.odds_b}</option>
            </select>
            <input class="inp inp-w" type="number" id="amt-${ev.id}" placeholder="Сумма" min="1" value="100">
            <button class="btn btn-primary btn-sm" onclick="placeBet('${ev.id}')">Поставить</button>
          </div>
        ` : myBet ? `
          <div style="font-size:12px;color:#888;margin-top:4px">
            Ставка: <strong style="color:#7c6ff7">${myBet.side}</strong> на <strong>${myBet.amount.toLocaleString()}</strong>
            ${myBet.status==='won' ? `<span class="payout-label"> → +${myBet.payout.toLocaleString()} 🎉</span>` : ''}
            ${myBet.status==='lost' ? `<span style="color:#f07070"> — проиграл</span>` : ''}
          </div>
        ` : ''}
        ${isHost && ev.status === 'locked' ? `
          <div class="host-btns">
            <button class="btn btn-success btn-sm" onclick="resolveEvent('${ev.id}','a')">✓ ${ev.option_a}</button>
            <button class="btn btn-success btn-sm" onclick="resolveEvent('${ev.id}','b')">✓ ${ev.option_b}</button>
          </div>
        ` : ''}
        ${ev.bets.length ? `
          <div class="bets-list">
            ${ev.bets.map(b => `
              <div class="bet-row ${b.status}">
                <span style="color:#ccc">${b.nickname}</span>
                <span>${b.side} · ${b.amount.toLocaleString()}${b.status==='won'?` <span class="payout-label">+${b.payout.toLocaleString()}</span>`:''}</span>
              </div>
            `).join('')}
            <div style="font-size:10px;color:#555;margin-top:4px">Пул: ${totalPool.toLocaleString()}</div>
          </div>
        ` : ''}
      </div>`;
    }).join('');
  }

  function renderScoreBets(me, session) {
    const el = document.getElementById('score-bets-list');
    // Group by title
    const groups = {};
    scoreBets.forEach(b => {
      if (!groups[b.title]) groups[b.title] = [];
      groups[b.title].push(b);
    });

    if (!Object.keys(groups).length) {
      el.innerHTML = `<div class="empty">Ставок на точный счёт пока нет</div>`;
      return;
    }

    el.innerHTML = Object.entries(groups).map(([title, bets]) => {
      const bank = bets.filter(b => ['confirmed','won','lost'].includes(b.status)).reduce((s,b) => s + b.amount, 0);
      return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="font-size:15px;font-weight:700">${title}</div>
          <div style="font-size:12px;color:#888">Банк: <strong style="color:#7c6ff7">${bank.toLocaleString()}</strong></div>
        </div>
        ${bets.map(b => `
          <div class="score-bet-card">
            <div class="score-bet-header">
              <div>
                <div style="font-size:12px;color:#888;margin-bottom:2px">${b.nickname} · ${b.amount.toLocaleString()} монет</div>
                <div class="score-bet-pred">${b.prediction}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                <span class="status-badge s-${b.status}">
                  ${b.status==='created'?'Создано':b.status==='confirmed'?'Подтверждено':b.status==='won'?'Выиграл 🎉':'Не сыграло'}
                </span>
                ${b.status==='won' ? `<span class="payout-label">+${b.payout.toLocaleString()}</span>` : ''}
              </div>
            </div>
            ${isHost ? `
              <div class="host-btns">
                ${b.status==='created' ? `<button class="btn btn-success btn-sm" onclick="confirmScoreBet('${b.id}')">✓ Подтвердить</button>` : ''}
                ${b.status==='confirmed' ? `
                  <button class="btn btn-success btn-sm" onclick="resolveScoreBet('${b.id}','won')">🎉 Выиграл</button>
                  <button class="btn btn-danger btn-sm" onclick="resolveScoreBet('${b.id}','lost')">✗ Не сыграло</button>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }

  async function adjustBalance(playerId, sign) {
    const input = document.getElementById(`bal-${playerId}`);
    const val = parseInt(input.value);
    if (!val || val <= 0) return alert('Введи сумму');
    const delta = sign * val;
    const res = await fetch(`/api/players/${playerId}/balance`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ delta })
    });
    if (!res.ok) { const d = await res.json(); return alert(d.error); }
    input.value = '';
    await load();
  }

  async function placeBet(eventId) {
    const side = document.getElementById(`side-${eventId}`).value;
    const amount = parseInt(document.getElementById(`amt-${eventId}`).value);
    const res = await fetch('/api/bets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eventId, guestToken, side, amount })
    });
    const data = await res.json();
    if (!res.ok) return alert(data.error);
    await load();
  }

  async function placeScoreBet() {
    const title = document.getElementById('sb-title').value.trim();
    const prediction = document.getElementById('sb-pred').value.trim();
    const amount = parseInt(document.getElementById('sb-amount').value);
    if (!title || !prediction || !amount) return alert('Заполни все поля');
    const res = await fetch('/api/score-bets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, guestToken, title, prediction, amount })
    });
    const data = await res.json();
    if (!res.ok) return alert(data.error);
    document.getElementById('sb-pred').value = '';
    document.getElementById('sb-amount').value = '';
    await load();
  }

  async function confirmScoreBet(id) {
    await fetch(`/api/score-bets/${id}/confirm`, { method: 'PATCH' });
    await load();
  }

  async function resolveScoreBet(id, result) {
    await fetch(`/api/score-bets/${id}/${result}`, { method: 'PATCH' });
    await load();
  }

  async function createEvent() {
    const res = await fetch('/api/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        title: document.getElementById('ev-title').value.trim(),
        optionA: document.getElementById('ev-a').value.trim(),
        optionB: document.getElementById('ev-b').value.trim(),
        oddsA: parseFloat(document.getElementById('ev-oa').value),
        oddsB: parseFloat(document.getElementById('ev-ob').value)
      })
    });
    if (!res.ok) { const d = await res.json(); return alert(d.error); }
    ['ev-title','ev-a','ev-b'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('ev-oa').value = '2.0';
    document.getElementById('ev-ob').value = '2.0';
    await load();
  }

  async function lockEvent(id) {
    await fetch(`/api/events/${id}/lock`, { method: 'PATCH' });
    await load();
  }

  async function resolveEvent(id, outcome) {
    await fetch(`/api/events/${id}/resolve`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ outcome })
    });
    await load();
  }

  async function startSession() {
    await fetch(`/api/sessions/${sessionId}/start`, { method: 'PATCH' });
    await load();
  }

  async function finishSession() {
    if (!confirm('Завершить сессию?')) return;
    await fetch(`/api/sessions/${sessionId}/finish`, { method: 'PATCH' });
    await load();
  }

  function copyCode() {
    const code = state?.session?.code;
    if (!code) return;
    navigator.clipboard.writeText(code).then(() => {
      const el = document.getElementById('room-code');
      el.textContent = 'Скопировано!';
      setTimeout(() => el.textContent = code, 1500);
    });
  }

  load();
  setInterval(load, 5000);
</script>
</body>
</html>
